server:
  port: ${MS1_SERVER_PORT:8080}

spring:
  application:
    name: ms1-usuarios

  datasource:
    url: jdbc:postgresql://postgres-users:5432/${USER_DB_NAME}
    username: ${USER_DB_USER}
    password: ${USER_DB_PASSWORD}

  security:
    user:
      name: ${MS1_SECURITY_USER}
      password: ${MS1_SECURITY_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true
