services:

  postgres-users:
    image: postgres:17
    container_name: postgres-users
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
      POSTGRES_DB: ${USER_DB_NAME}
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres-users-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
 
  postgres-transactions:
    image: postgres:17
    container_name: postgres-transactions
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TRANSACTION_DB_USER}
      POSTGRES_PASSWORD: ${TRANSACTION_DB_PASSWORD}
      POSTGRES_DB: ${TRANSACTION_DB_NAME}
      TZ: America/Sao_Paulo
    ports:
      - "5433:5432"
    volumes:
      - postgres-transactions-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
 
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres-users:
        condition: service_healthy
      postgres-transactions:
        condition: service_healthy

  ms1-usuarios:
    build:
      context: ./ms1-usuarios
      dockerfile: Dockerfile
    container_name: ms1-usuarios
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MS1_SERVER_PORT: ${MS1_SERVER_PORT}
      USER_DB_NAME: ${USER_DB_NAME}
      USER_DB_USER: ${USER_DB_USER}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      MS1_SECURITY_USER: ${MS1_SECURITY_USER}
      MS1_SECURITY_PASSWORD: ${MS1_SECURITY_PASSWORD}
    depends_on:
      postgres-users:
        condition: service_healthy

  ms2-transacoes:
    build:
      context: ./ms2-transacoes
      dockerfile: Dockerfile
    container_name: ms2-transacoes
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      MS2_SERVER_PORT: ${MS2_SERVER_PORT}
      TRANSACTION_DB_NAME: ${TRANSACTION_DB_NAME}
      TRANSACTION_DB_USER: ${TRANSACTION_DB_USER}
      TRANSACTION_DB_PASSWORD: ${TRANSACTION_DB_PASSWORD}
      MS2_SECURITY_USER: ${MS2_SECURITY_USER}
      MS2_SECURITY_PASSWORD: ${MS2_SECURITY_PASSWORD}
    depends_on:
      postgres-transactions:
        condition: service_healthy
 
volumes:
  postgres-users-data:
  postgres-transactions-data:
  pgadmin-data: